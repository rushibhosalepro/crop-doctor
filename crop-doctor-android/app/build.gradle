plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.cropdoctor.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cropdoctor.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0-mvp'
    }

    buildTypes {
        debug {
            // No applicationIdSuffix: debug and release share one package
            // (com.cropdoctor.app) so a single google-services.json works.
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:2.4.21'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.4.21'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.4.21'
        force 'org.jetbrains.kotlin:kotlin-reflect:2.4.21'
    }
}

dependencies {
    implementation(platform('com.google.firebase:firebase-bom:34.10.0'))
    // AI Logic versions pinned exactly as the hybrid docs require
    // (the on-device SDK is not in the BoM).
    implementation('com.google.firebase:firebase-ai:18.2.0')
    implementation('com.google.firebase:firebase-ai-ondevice:16.0.0-beta08')
    implementation('com.google.firebase:firebase-appcheck-debug:20.1.0')
    implementation('com.google.firebase:firebase-auth')
    implementation('com.google.firebase:firebase-firestore')

    implementation('androidx.core:core-ktx:1.13.1')
    implementation('androidx.appcompat:appcompat:1.7.0')
    implementation('androidx.activity:activity-compose:1.9.2')
    implementation(platform('androidx.compose:compose-bom:2024.10.01'))
    implementation('androidx.compose.ui:ui')
    implementation('androidx.compose.ui:ui-tooling-preview')
    debugImplementation('androidx.compose.ui:ui-tooling')
    implementation('androidx.compose.material3:material3')
    implementation('androidx.compose.material:material-icons-extended')
    implementation('androidx.lifecycle:lifecycle-runtime-compose:2.7.0')
    implementation('org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3')
    implementation('org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1')
    implementation('org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1')
    testImplementation('junit:junit:4.13.2')
}
